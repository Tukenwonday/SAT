<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History P1 — Minimal premium</title>
<style>
  :root {
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ink: #101223;
    --muted: #8a8fa3;
    --line: #eef0f6;
    --accent: #4f46e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); color: var(--ink);
    background: linear-gradient(180deg, #f6f7fb 0%, #eceef5 100%);
    min-height: 100vh;
  }
  #demo {
    position: fixed; top: 10px; left: 10px; z-index: 999;
    background: #111; color: #fff; font-size: 12px; font-weight: 700;
    padding: 8px 12px; border-radius: 10px; display: flex; gap: 8px; align-items: center;
  }
  #demo a { color: #ffd75d; text-decoration: none; }
  #demo button {
    background: #fff; color: #111; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 800; padding: 5px 10px; cursor: pointer;
  }
  .overlay {
    position: fixed; inset: 0; padding: 20px;
    background: rgba(16, 18, 35, .38);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
  }
  .overlay.open { opacity: 1; visibility: visible; }
  .modal {
    width: 100%; max-width: 520px; background: #fff;
    border: 1px solid #e7e9f2; border-radius: 28px;
    box-shadow: 0 30px 80px rgba(16, 18, 35, .16), 0 2px 6px rgba(16, 18, 35, .06);
    padding: 28px 28px 24px;
    max-height: calc(100dvh - 60px); overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    animation: cardin .4s cubic-bezier(.2, .9, .3, 1);
  }
  .modal::-webkit-scrollbar { display: none; }
  @keyframes cardin {
    0% { transform: translateY(24px) scale(.98); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .hrule { width: 44px; height: 3px; background: #111; border-radius: 2px; margin: 14px auto 0; }
  /* segmented tabs */
  .hist-tabs { display: flex; gap: 0; margin: 24px 0 6px; padding: 5px; background: #f2f3f8; border-radius: 18px; }
  .hist-tabs button {
    flex: 1; padding: 12px; font-size: 15px; font-weight: 800; font-family: var(--sans);
    color: #6d7285; background: transparent; border: none; border-radius: 13px; cursor: pointer;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .hist-tabs button.sel { background: #fff; color: var(--ink); box-shadow: 0 3px 10px rgba(16, 18, 35, .12); }
  /* day navigator */
  .daynav { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 18px 0 6px; }
  .daynav button {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent;
    font-size: 20px; font-weight: 800; color: var(--ink); cursor: pointer; line-height: 1;
    transition: background .15s;
  }
  .daynav button:hover:not(:disabled) { background: #eef0f7; }
  .daynav button:disabled { opacity: .25; cursor: default; }
  .daynav b { font-size: 15px; font-variant-numeric: tabular-nums; min-width: 110px; text-align: center; }
  /* daily rows */
  .prow {
    display: flex; align-items: center; padding: 13px 6px;
    border-bottom: 1px solid var(--line);
    animation: rowin .35s cubic-bezier(.2, .9, .3, 1) backwards;
  }
  .prow:last-child { border-bottom: none; }
  .prow:hover { background: #fafbff; }
  @keyframes rowin { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
  .prow .nm { font-size: 15.5px; font-weight: 800; letter-spacing: -.2px; }
  .prow .ct { margin-left: auto; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .prow .ct.zero { color: #c3c7d4; }
  /* centered duel rows: names outside, combined score middle, date + meta below */
  .drow {
    padding: 15px 6px 13px; text-align: center;
    border-bottom: 1px solid var(--line);
    animation: rowin .35s cubic-bezier(.2, .9, .3, 1) backwards;
  }
  .drow:last-child { border-bottom: none; }
  .drow:hover { background: #fafbff; }
  .drow.declined { opacity: .55; }
  .dmatch { display: flex; align-items: baseline; justify-content: center; gap: 20px; }
  .dmatch .nm {
    flex: 1; min-width: 0; font-size: 15.5px; font-weight: 800; letter-spacing: -.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dmatch .nm.left { text-align: left; }
  .dmatch .nm.right { text-align: right; }
  .dmatch .nm.dim { opacity: .45; }
  .dmatch .mid { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.5px; }
  .dsub { font-size: 12.5px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .dsub2 { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .hempty {
    padding: 34px 10px; text-align: center; font-size: 14px; font-weight: 600;
    color: var(--muted); line-height: 1.6;
  }
  .mrow { display: flex; justify-content: flex-end; margin-top: 18px; }
  #histclose {
    background: transparent; border: none; color: var(--muted);
    font-size: 15px; font-weight: 700; font-family: var(--sans);
    padding: 12px 10px; cursor: pointer;
  }
  #histclose:hover { color: var(--ink); }
</style>
</head>
<body>

<div id="demo">
  <span>HISTORY P1 · MINIMAL PREMIUM</span>
  <button id="emptytoggle" type="button">simulate: empty</button>
  <button id="reopen" type="button" style="display:none">reopen modal</button>
  <a href="./index.html">← all</a>
</div>

<div class="overlay open" id="ov-history"><div class="modal" style="max-width:520px">
  <h2>History</h2>
  <div class="hrule"></div>
  <div id="hist-body"></div>
  <div class="mrow"><button id="histclose">Close</button></div>
</div></div>

<script>
// Demo data (from real screenshots) + wiring mirroring backend.js renderDaily/renderDuels.
const DAYS = [
  { day: "2026-10-16", per: { TEST: 0, Ahmad: 0, Glykeria: 16, Khaled: 10, SariOS: 0, Waleed: 23, Yousef: 36 } },
  { day: "2026-10-15", per: { TEST: 2, Ahmad: 5, Glykeria: 9, Khaled: 14, SariOS: 1, Waleed: 18, Yousef: 22 } },
];
const NAMES = ["TEST", "Ahmad", "Glykeria", "Khaled", "SariOS", "Waleed", "Yousef"];
const DUELS = [
  { h: "Yousef", g: "Khaled", day: "2026-10-16", n: 5, hs: 3, gs: 3, kind: "tie" },
  { h: "Yousef", g: "Glykeria", day: "2026-10-16", n: 5, hs: 3, gs: 4, kind: "decided" },
  { h: "Waleed", g: "Yousef", day: "2026-10-16", n: 10, hs: 4, gs: 6, kind: "decided" },
  { h: "Sara", g: "Yousef", day: "2026-10-15", n: 10, hs: null, gs: null, kind: "declined" },
];
let tab = "daily", dayIdx = 0, empty = false;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const box = () => document.getElementById('hist-main');
function render() {
  const tabs = tab === "daily"
    ? `<div class="hist-tabs"><button id="hist-tab-daily" class="sel">Daily</button><button id="hist-tab-duels">Duels</button></div><div id="hist-main"></div>`
    : `<div class="hist-tabs"><button id="hist-tab-daily">Daily</button><button id="hist-tab-duels" class="sel">Duels</button></div><div id="hist-main"></div>`;
  document.getElementById('hist-body').innerHTML = tabs;
  document.getElementById('hist-tab-daily').onclick = () => { tab = "daily"; render(); };
  document.getElementById('hist-tab-duels').onclick = () => { tab = "duels"; render(); };
  if (tab === "duels") renderDuels(box());
  else renderDaily(box());
}
function renderDaily(b) {
  if (empty) { b.innerHTML = '<div class="hempty">No attempts yet — answer some questions first!</div>'; return; }
  dayIdx = Math.max(0, Math.min(dayIdx, DAYS.length - 1));
  const d = DAYS[dayIdx];
  let h = `<div class="daynav"><button id="day-prev"${dayIdx >= DAYS.length - 1 ? " disabled" : ""}>‹</button>` +
    `<b>${esc(d.day.slice(5))}</b>` +
    `<button id="day-next"${dayIdx <= 0 ? " disabled" : ""}>›</button></div>`;
  NAMES.forEach((n, i) => {
    const c = (d.per && d.per[n]) || 0;
    h += `<div class="prow" style="animation-delay:${Math.min(i * 35, 210)}ms">` +
      `<span class="nm">${esc(n)}</span><span class="ct${c ? "" : " zero"}">${c}</span></div>`;
  });
  b.innerHTML = h;
  document.getElementById('day-prev').onclick = () => { dayIdx++; renderDaily(b); };
  document.getElementById('day-next').onclick = () => { dayIdx--; renderDaily(b); };
}
function titleOf(s) {
  if (s.kind === "declined") return s.g + " declined"; // the guest declines the host's invite
  if (s.hs === s.gs) return "Dead even";
  return (s.hs > s.gs ? s.h : s.g) + " wins";
}
function renderDuels(b) {
  if (empty) { b.innerHTML = '<div class="hempty">No duels yet — send a ⚔️ challenge!</div>'; return; }
  let h = "";
  DUELS.forEach((s, i) => {
    const live = s.kind === "decided";
    const lw = live ? (s.hs > s.gs ? "r" : "l") : ""; // dim the loser
    const mid = s.kind === "declined" ? "–" : (s.hs + "–" + s.gs);
    h += `<div class="drow${s.kind === "declined" ? " declined" : ""}" style="animation-delay:${Math.min(i * 40, 240)}ms">` +
      `<div class="dmatch"><span class="nm left${lw === "l" ? " dim" : ""}">${esc(s.h)}</span>` +
      `<span class="mid">${mid}</span>` +
      `<span class="nm right${lw === "r" ? " dim" : ""}">${esc(s.g)}</span></div>` +
      `<div class="dsub">${esc(s.day.slice(5))}</div>` +
      `<div class="dsub2">${s.n} questions · ${esc(titleOf(s))}</div></div>`;
  });
  b.innerHTML = h;
}
document.getElementById('histclose').onclick = () => {
  document.getElementById('ov-history').classList.remove('open');
  document.getElementById('reopen').style.display = '';
};
document.getElementById('emptytoggle').onclick = e => {
  empty = !empty; render();
  e.currentTarget.textContent = empty ? 'simulate: has data' : 'simulate: empty';
};
document.getElementById('reopen').onclick = e => {
  document.getElementById('ov-history').classList.add('open');
  e.currentTarget.style.display = 'none';
};
render();
</script>
</body>
</html>
