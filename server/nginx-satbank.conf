# Nginx reverse proxy for the SAT practice VPS backend.
# Assumes: static frontend served from /var/www/satbank, API on 127.0.0.1:3001.
# After placing: certbot --nginx -d your-domain.com
# No domain? Use the sslip.io hostname for your VPS IP instead, e.g.
# certbot --nginx -d 51-84-109-28.sslip.io  (adjust server_name below).
# The frontend (Cloudflare Pages, HTTPS) talks to this host directly — plain http://IP
# and ws:// are blocked by browsers (mixed content), so TLS here is required.
server {
  listen 80;
  server_name 51-84-109-28.sslip.io;
  server_tokens off; # hide nginx version

  root /var/www/satbank;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Long-lived websocket + polling: don't cut or buffer them.
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
